<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator in Web</title>
</head>
<body>
    <div id="calc">
        <div id="screen">
            <input type="text" id="s">
        </div>
        <div id="buttons">
            <div class="row">
                <div class="b">
                    <input type="button" class="c" id="ac" value="AC">
                </div>
                <div class="b">
                    <input type="button" class="c" id="p" value="%">
                </div>
                <div class="b">
                    <input type="button" class="c" id="c" value="">
                </div>
                <div class="b">
                    <input type="button" class="c" id="division" value="÷">
                </div>
            </div>
            <div class="row">
                <div class="b">
                    <input type="button" class="c" id="seven" value="7">
                </div>
                <div class="b">
                    <input type="button" class="c" id="eight" value="8">
                </div>
                <div class="b">
                    <input type="button" class="c" id="nine" value="9">
                </div>
                <div class="b">
                    <input type="button" class="c" id="multiplication" value="✕">
                </div>
            </div>
            <div class="row">
                <div class="b">
                    <input type="button" class="c" id="four" value="4">
                </div>
                <div class="b">
                    <input type="button" class="c" id="five" value="5">
                </div>
                <div class="b">
                    <input type="button" class="c" id="six" value="6">
                </div>
                <div class="b">
                    <input type="button" class="c" id="substraction" value="-">
                </div>
            </div>
            <div class="row">
                <div class="b">
                    <input type="button" class="c" id="one" value="1">
                </div>
                <div class="b">
                    <input type="button" class="c" id="two" value="2">
                </div>
                <div class="b">
                    <input type="button" class="c" id="three" value="3">
                </div>
                <div class="b">
                    <input type="button" class="c" id="addition" value="+">
                </div>
            </div>
            <div class="row">
                <div class="b">
                    <input type="button" class="c" id="dzero" value="00">
                </div>
                <div class="b">
                    <input type="button" class="c" id="zero" value="0">
                </div>
                <div class="b">
                    <input type="button" class="c" id="dot" value=".">
                </div>
                <div class="b">
                    <input type="button" class="c" id="equal" value="=">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
