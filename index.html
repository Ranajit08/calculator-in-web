<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="title" content="Calculator in Web">
    <meta name="description" content="A simple calculator built using HTML, CSS, and JavaScript. It features basic arithmetic operations and a user-friendly interface.">
    <meta name="keywords" content="calculator, web calculator, HTML calculator, CSS calculator, JavaScript calculator, online calculator, basic arithmetic, user-friendly interface">
    <meta name="author" content="Ranajit Mitra">

    <meta property="og:title" content="Calculator in Web">
    <meta property="og:description" content="A simple calculator built using HTML, CSS, and JavaScript. It features basic arithmetic operations and a user-friendly interface.">
    <meta property="og:image" content="https://ranajit08.github.io/calculator-in-web/thumbnail.png"> 
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="849">
    <meta property="og:image:height" content="533">     
    <meta property="og:url" content="https://ranajit08.github.io/calculator-in-web/">
    <meta prperty="og:type" content="website">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <title>Calculator in Web</title>
</head>
<body>
    <div id="loader" class="loader-screen">
        <div class="spinner"></div>
    </div>
    <div id="calc">
        <div id="screen">
            <input type="text" id="s" readonly>
        </div>
        <div id="buttons">
            <div class="row">
                <div class="b">
                    <input type="button" class="c" id="ac" value="AC">
                </div>
                <div class="b">
                    <input type="button" class="c" id="p" value="%">
                </div>
                <div class="b">
                    <input type="button" class="c" id="c" value="⌫">
                </div>
                <div class="b">
                    <input type="button" class="c" id="division" value="÷">
                </div>
            </div>
            <div class="row">
                <div class="b">
                    <input type="button" class="c" id="seven" value="7">
                </div>
                <div class="b">
                    <input type="button" class="c" id="eight" value="8">
                </div>
                <div class="b">
                    <input type="button" class="c" id="nine" value="9">
                </div>
                <div class="b">
                    <input type="button" class="c" id="multiplication" value="✕">
                </div>
            </div>
            <div class="row">
                <div class="b">
                    <input type="button" class="c" id="four" value="4">
                </div>
                <div class="b">
                    <input type="button" class="c" id="five" value="5">
                </div>
                <div class="b">
                    <input type="button" class="c" id="six" value="6">
                </div>
                <div class="b">
                    <input type="button" class="c" id="substraction" value="-">
                </div>
            </div>
            <div class="row">
                <div class="b">
                    <input type="button" class="c" id="one" value="1">
                </div>
                <div class="b">
                    <input type="button" class="c" id="two" value="2">
                </div>
                <div class="b">
                    <input type="button" class="c" id="three" value="3">
                </div>
                <div class="b">
                    <input type="button" class="c" id="addition" value="+">
                </div>
            </div>
            <div class="row">
                <div class="b">
                    <input type="button" class="c" id="dzero" value="00">
                </div>
                <div class="b">
                    <input type="button" class="c" id="zero" value="0">
                </div>
                <div class="b">
                    <input type="button" class="c" id="dot" value=".">
                </div>
                <div class="b">
                    <input type="button" class="c" id="equal" value="=">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
